[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned so a fresh checkout reproduces the bytecode the tests were run against
# (as of 2026-10-29).
solc_version = "0.8.33"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
