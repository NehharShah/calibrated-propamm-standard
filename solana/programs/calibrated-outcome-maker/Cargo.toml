[package]
name = "calibrated-outcome-maker"
version = "0.1.0"
description = "Calibrated market maker for binary outcome tokens (Shah 2026, Digital Finance)"
license = "CC0-1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "calibrated_outcome_maker"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = "1.2.2"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
proptest = "1.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
